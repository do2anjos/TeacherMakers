services:
  # Backend Service
  - type: web
    name: teachermakers-back
    env: node
    plan: free
    buildCommand: npm install && cd Back && npm install
    startCommand: cd Back && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://teachermakers.onrender.com
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

  - type: web
    name: teachermakers
    runtime: static
    buildCommand: "" # No build needed for static files
    staticPublishPath: Front/public
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
