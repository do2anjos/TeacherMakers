<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TeacherMakers — Crie sua conta e comece a aprender." />
  <title>Cadastro — TeacherMakers</title>
  <link rel="stylesheet" href="style.css" />

  <link rel="icon" href="img/favicon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <script src="script/theme.js"></script>
</head>

<body class="auth-page">

  <div class="hero-blob bg-aqua animate-float" style="top:2rem;    left:5rem;   height:7rem; width:7rem; opacity:.4;">
  </div>
  <div class="hero-blob bg-gold animate-bounce-soft"
    style="bottom:5rem; right:3rem;  height:5rem; width:5rem; opacity:.3;  animation-delay:.5s;"></div>
  <div class="hero-blob bg-sky-light animate-float"
    style="top:60%;     left:8%;     height:4rem; width:4rem; opacity:.35; animation-delay:.8s;"></div>
  <div class="hero-blob bg-teal-soft animate-bounce-soft"
    style="top:10%;    right:20%;   height:3rem; width:3rem; opacity:.25; animation-delay:.2s;"></div>

  <nav class="landing-navbar">
    <a href="index.html" class="logo">
      
      <span>TeacherMakers</span>
    </a>
  </nav>

  <main class="auth-main">
    <div class="auth-card">
      
      <div class="auth-logo" style="margin-bottom: 1rem;">
        <div class="auth-icon-wrapper">
          
        </div>
        <h1 style="font-size: 1.5rem; margin-bottom: 0.2rem;">Criar Conta</h1>
        <p style="margin-bottom: 0;">Junte-se ao TeacherMakers!</p>
      </div>

      <div class="form-alert" id="form-alert"></div>

      <form class="auth-form" id="cadastro-form" style="gap: 0.75rem;" novalidate>
        <div class="form-group">
          <label for="name">Nome Completo</label>
          <input id="name" type="text" class="form-input" placeholder="Seu nome" autocomplete="name" />
        </div>

        <div class="form-group">
          <label for="email">E-mail Profissional</label>
          <input id="email" type="email" class="form-input" placeholder="seu@email.com" autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="nivel-ensino">Nível de Ensino</label>
          <select id="nivel-ensino" class="form-input" style="cursor: pointer; appearance: auto;">
            <option value="" disabled selected>Selecione um nível</option>
            <option value="fundamental1">Ensino Fundamental 1</option>
            <option value="fundamental2">Ensino Fundamental 2</option>
            <option value="medio">Ensino Médio</option>
            <option value="eja">EJA - Educação de Jovens e Adultos</option>
          </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <div class="form-group">
            <label for="password">Senha</label>
            <input id="password" type="password" class="form-input" placeholder="Mín. 6 char"
              autocomplete="new-password" />
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirmar Senha</label>
            <input id="confirm-password" type="password" class="form-input" placeholder="Repita a senha"
              autocomplete="new-password" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-auth" id="submit-btn" style="padding: 0.75rem; font-size: 1rem;">
          Criar Conta
        </button>
      </form>

      <div class="auth-divider"><span>ou</span></div>

      <p class="auth-footer-text">
        Já tem uma conta? <a href="Login.html">Entrar</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <h3>TeacherMakers</h3>
      <small> 2026 TeacherMakers</small>
    </div>
  </footer>

  <script src="script/api.js"></script>
  <script src="script/auth.js"></script>
</body>

</html>
